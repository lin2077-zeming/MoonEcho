name: CI

env:
  MOONBIT_VERSION: 0.10.17+d971670cd

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show MoonBit version
        run: moon version --all

      - name: Update MoonCakes registry and dependencies
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check all targets
        run: moon check --target all --deny-warn

      - name: Build all supported targets
        run: moon build --target all --release --deny-warn

      - name: Bundle all supported targets
        run: moon bundle --all --release --deny-warn

      - name: Build native CLI
        run: moon build cmd/moonecho-cli --target native --release --deny-warn

      - name: Smoke-test CLI exit codes
        run: npm run smoke:cli

      - name: Test wasm target
        run: moon test --target wasm --deny-warn

      - name: Test native target
        run: moon test --target native --deny-warn

      - name: Build and smoke-test WASM demo
        run: |
          npm run build:demo
          npm run smoke:demo

      - name: Run CLI
        run: moon run cmd/moonecho-cli
